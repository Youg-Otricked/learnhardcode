<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Lessons</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="hello.css?v=123">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="hello.js?v=137" defer></script>
    <script src="chapters.js" type="module" defer></script>
</head>

<body>
    <p id="streak">Lessons in a row: 0</p>
    <p id="difficulty">Dificulty: unknown</p>
    <p id="xp">X / X XP. Level X.</p><progress id="levelProg" value="0" max = "100"></progress>
    <br><button style="width: fit-content; height: fit-content;  background-color: lightgray; color: black; border-radius: 7; padding-bottom: 5px;" onclick='document.location="../"'>Go to Homepage</button><details id="chapters" style="z-index: 9999;  position: absolute; top: 0; right: 0; text-align: center;"><summary style="padding: 0 30px;">Chapters</summary></details>
    
    <div class="container">
        <div class="box text-box">
            <h1 id="lesson-title"></h1>
            <div id="lesson-description"></div><br><br>
            <p id="nobns"></p>
            <button onclick='btn("b1")' id="b1" class="ans">Nothing here for now...</button><br><br>
            <button id="b2" onclick='btn("b2")' class="ans">Nothing here for now...</button><br><br>
            <button id="b3" onclick='btn("b3")' class="ans">Nothing here for now...</button><br><br>
            <button id="b4" onclick='btn("b4")' class="ans">Nothing here for now...</button><br><br>
            <div class="hint">
                <button class="hint-toggle">Show hint ▾</button>
                <div id="hint-body" class="hint-body">
                </div>
            </div>
        </div>
        <div class="box code-box">
            <div id="editor" style="width: 100%; height: 400px; border: 1px solid #333;"></div>
            <br>
            <button id="run">Build & Run</button>
            <button id="next-lesson" style="display:none">Next Lesson</button>
            <button id="prev-lesson">Previous Lesson</button>
            <pre id="out"></pre>
            <div>
                <label>
                    <p id="expected-stdout"></p>
                </label>
                <button id="check-stdout">Submit</button>
                <button id="check-result" style="display:none">Check Result</button>
                <button id="load-solution">Load Solution</button>
                </div>
        </div>
    </div>
</body>

</html>
